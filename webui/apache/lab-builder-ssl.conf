# lab-builder — HTTPS vhost for the automation VM.
#
# Install to:
#   /etc/apache2/vhosts.d/lab-builder-ssl.conf   (SLES/openSUSE)
#   /etc/httpd/conf.d/lab-builder-ssl.conf       (RHEL family)
#
# This is ADDITIVE only: it adds a new vhost on port 443 for the lab-builder
# app. It does NOT touch the existing plain-HTTP vhost that serves
# /srv/www/htdocs/lab_creation/ — that plain-HTTP path is what VMs fetch
# their ignition/combustion/cloud-init/install_iso files from during boot,
# and must keep working unencrypted (installers/kernels can't generally do
# HTTPS, especially not against a self-signed cert they don't trust).
#
# lab-builder.conf's Alias/ScriptAlias directives are server-scope
# (deliberately, see that file's own header comment) and so are inherited
# here automatically — this file only needs to declare the vhost + TLS
# settings, not repeat the Alias/ScriptAlias.
#
# Requires mod_ssl (and mod_rewrite, for the HTTP->HTTPS redirect below)
# enabled — install_automation_node_scripts.sh's cert/module setup handles
# this when _webui_tls is left at its default ("1"); set _webui_tls=0 to
# skip TLS and this file is simply never installed.

Listen 443

<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile    /etc/lab-builder/tls/cert.pem
    SSLCertificateKeyFile /etc/lab-builder/tls/key.pem
</VirtualHost>

# Redirect plain-HTTP requests for /lab-builder specifically to HTTPS —
# scoped to this one path so /lab_creation/ (VM provisioning) is untouched.
<Location /lab-builder>
    RewriteEngine on
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</Location>
