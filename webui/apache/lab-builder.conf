# lab-builder — Apache drop-in for the automation VM.
#
# Install to:
#   /etc/apache2/conf.d/lab-builder.conf   (SLES/openSUSE)
#   /etc/httpd/conf.d/lab-builder.conf     (RHEL family)
#
# These are SERVER-SCOPE directives (deliberately not wrapped in a
# <VirtualHost>), so every vhost inherits them — plain http and TLS alike.
# On SLES, conf.d is included from default-server.conf *before* vhosts.d, so an
# SSL vhost defined there picks these up automatically.
#
# ORDER MATTERS: Apache matches Alias/ScriptAlias in the order they are
# declared, first match wins. The specific /lab-builder/api ScriptAlias must be
# declared BEFORE the broader /lab-builder Alias, otherwise API requests are
# served as static files and 404.
#
# Requires the CGI module (SLES: add 'cgid' to APACHE_MODULES in
# /etc/sysconfig/apache2; RHEL: mod_cgid is on by default).
#
# The CGI runs as the Apache user. It only reads schemas and writes generated
# labs under LABBUILDER_OUTPUT_DIR. It never builds labs or runs anything
# privileged.

Define LABBUILDER_ROOT /srv/www/lab-builder

# ── JSON API (declared first: most specific) ──────────────────────────────────
ScriptAlias /lab-builder/api ${LABBUILDER_ROOT}/cgi-bin/labbuilder.py

<Directory ${LABBUILDER_ROOT}/cgi-bin>
    Require all granted
    Options +ExecCGI
    SetHandler cgi-script

    # --- optional overrides (scripts/libs dirs are auto-detected) ---
    # SetEnv LABBUILDER_SCRIPTS_DIR /usr/local/bin
    # SetEnv LABBUILDER_LIBS_DIR    /usr/local/lib/lab_creation
    SetEnv LABBUILDER_OUTPUT_DIR  /srv/www/lab-builder/labs
</Directory>

# ── Static single-page app ────────────────────────────────────────────────────
Alias /lab-builder ${LABBUILDER_ROOT}/htdocs

<Directory ${LABBUILDER_ROOT}/htdocs>
    Require all granted
    Options -Indexes
    DirectoryIndex index.html
</Directory>
